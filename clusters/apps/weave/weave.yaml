---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: weave-gitops
  namespace: flux-system
spec:
  interval: 1h
  type: oci
  # helm.gitops.weave.works is gone (Weaveworks shut down); chart still on ghcr
  url: oci://ghcr.io/weaveworks/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: weave-gitops
  namespace: flux-system
spec:
  chart:
    spec:
      chart: weave-gitops
      sourceRef:
        kind: HelmRepository
        name: weave-gitops
      version: 4.0.36
  interval: 1h0m0s
  values:
    adminUser:
      create: true
      # cluster-user-auth Secret is generated by terraform (random_password bcrypt_hash)
      createSecret: false
      username: admin
    listOCIRepositories: true
    resources:
      requests:
        cpu: 20m
        memory: 96Mi
      limits:
        memory: 256Mi
