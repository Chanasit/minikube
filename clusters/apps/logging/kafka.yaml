apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kafka
  namespace: logging
spec:
  interval: 1h
  type: oci                                 # ← this is the key change
  url: oci://registry-1.docker.io/bitnamicharts  # ← base OCI repo (no /kafka here)

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kafka
  namespace: logging
spec:
  interval: 1h
  timeout: 10m
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: kafka
      version: 32.4.3           # or pin exact version e.g. 32.4.3 → check latest!
      sourceRef:
        kind: HelmRepository
        name: kafka
        namespace: logging

  values:

    kraftVersion: 0
    clusterId: "keep-the-same-value-after-first-install"

    overrideConfiguration:
      auto.create.topics.enable: "true"

    image:
      registry: docker.io
      repository: bitnamilegacy/kafka           # ← changed from bitnamilegacy
      tag: "3.8.0-debian-12-r3"          # check https://hub.docker.com/r/bitnami/kafka/tags

    controller:
      replicaCount: 3                     # strongly recommended
      persistence:
        enabled: true
        # volumeClaimTemplates are immutable: changing size needs StatefulSet + PVC recreate (data loss).
        # minikube hostPath does not enforce it anyway.
        size: 50Gi
      heapOpts: "-Xmx512m -Xms512m"
      resources:
        requests:
          cpu: 100m
          memory: 768Mi
        limits:
          memory: 1Gi

    broker:
      replicaCount: 0                     # you can keep 0 if you want combined nodes

    # If you want separate controller + broker nodes (common pattern):
    # controller:
    #   replicaCount: 3
    #   controllerOnly: true
    # broker:
    #   replicaCount: 3..6

    listeners:
      client:
        protocol: SASL_PLAINTEXT
      interbroker:
        protocol: SASL_PLAINTEXT
      controller:
        protocol: SASL_PLAINTEXT

    sasl:
      enabledMechanisms: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
      interBrokerMechanism: PLAIN
      controllerMechanism:  PLAIN

      interbroker:
        user: "internal"
      controller:
        user: "controller"
      client:
        users:
          - "app1"
          - "logstash"
          - "metrics"
      # Passwords live in Secret kafka-sasl, generated by terraform (random_password), never in git.
      # Keys: client-passwords (comma list, same order as users), inter-broker-password, controller-password
      existingSecret: kafka-sasl

    # Very useful in production / debugging
    log4j: |
      log4j.rootLogger=INFO, stdout
      log4j.appender.stdout=org.apache.log4j.ConsoleAppender
      log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
      log4j.appender.stdout.layout.ConversionPattern=[%d] %p %m (%c)%n

    provisioning:
      enabled: true
      waitForKafka: true
      containerSecurityContext:
        readOnlyRootFilesystem: false
      topics:
        - name: logstash
          partitions: 3
          replicationFactor: 3          # match number of data nodes
          config:
            retention.ms: "604800000"     # 7 days
            min.insync.replicas: "2"

    # Optional – very useful
    metrics:
      kafka:
        enabled: false
      jmx:
        enabled: false
      serviceMonitor:
        enabled: false
