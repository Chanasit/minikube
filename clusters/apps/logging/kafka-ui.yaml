apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kafka-ui
  namespace: logging
spec:
  interval: 60m
  url: https://provectus.github.io/kafka-ui-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kafka-ui
  namespace: logging
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 60m
  releaseName: kafka-ui
  dependsOn:
    - name: kafka
      namespace: logging
  chart:
    spec:
      version: "0.7.4"
      chart: kafka-ui
      sourceRef:
        kind: HelmRepository
        name: kafka-ui
        namespace: logging
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:

    replicaCount: 1

    image:
      registry: docker.io
      repository: provectuslabs/kafka-ui
      pullPolicy: IfNotPresent
      # Overrides the image tag whose default is the chart appVersion.
      tag: ""

    imagePullSecrets: []
    nameOverride: ""
    fullnameOverride: ""

    serviceAccount:
      # Specifies whether a service account should be created
      create: true
      # Annotations to add to the service account
      annotations: {}
      # The name of the service account to use.
      # If not set and create is true, a name is generated using the fullname template
      name: ""

    existingConfigMap: ""
    yamlApplicationConfig:
      {}
      # kafka:
      #   clusters:
      #     - name: yaml
      #       bootstrapServers: kafka-service:9092
      # spring:
      #   security:
      #     oauth2:
      # auth:
      #   type: disabled
      # management:
      #   health:
      #     ldap:
      #       enabled: false
    yamlApplicationConfigConfigMap:
      {}
      # keyName: config.yml
      # name: configMapName
    existingSecret: ""
    envs:
      secret: {}
      config:
        KAFKA_CLUSTERS_0_NAME: kafka
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
        KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
        KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: PLAIN

    env:
      # password from Secret kafka-sasl (terraform-generated); kubelet expands $(VAR)
      - name: KAFKA_SASL_PASSWORD
        valueFrom:
          secretKeyRef:
            name: kafka-sasl
            key: app1-password
      - name: KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG
        value: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="app1" password="$(KAFKA_SASL_PASSWORD)";'

    networkPolicy:
      enabled: false
      egressRules:
        ## Additional custom egress rules
        ## e.g:
        ## customRules:
        ##   - to:
        ##       - namespaceSelector:
        ##           matchLabels:
        ##             label: example
        customRules: []
      ingressRules:
        ## Additional custom ingress rules
        ## e.g:
        ## customRules:
        ##   - from:
        ##       - namespaceSelector:
        ##           matchLabels:
        ##             label: example
        customRules: []

    podAnnotations: {}
    podLabels: {}

    ## Annotations to be added to kafka-ui Deployment
    ##
    annotations: {}

    ## Set field schema as HTTPS for readines and liveness probe
    ##
    probes:
      useHttpsScheme: false

    podSecurityContext:
      {}
      # fsGroup: 2000

    securityContext:
      {}
      # capabilities:
      #   drop:
      #   - ALL
      # readOnlyRootFilesystem: true
      # runAsNonRoot: true
      # runAsUser: 1000

    service:
      type: ClusterIP
      port: 80
      # In case of service type LoadBalancer, you can specify reserved static IP
      # loadBalancerIP: 10.11.12.13
      # if you want to force a specific nodePort. Must be use with service.type=NodePort
      # nodePort:

    # Ingress configuration
    ingress:
      # Enable ingress resource
      enabled: false

      # Annotations for the Ingress
      annotations: {}

      # ingressClassName for the Ingress
      ingressClassName: ""

      # The path for the Ingress
      path: "/"

      # The path type for the Ingress
      pathType: "Prefix"

      # The hostname for the Ingress
      host: ""

      # configs for Ingress TLS
      tls:
        # Enable TLS termination for the Ingress
        enabled: false
        # the name of a pre-created Secret containing a TLS private key and certificate
        secretName: ""

      # HTTP paths to add to the Ingress before the default path
      precedingPaths: []

      # Http paths to add to the Ingress after the default path
      succeedingPaths: []

    resources:
      requests:
        cpu: 100m
        memory: 320Mi
      limits:
        memory: 512Mi

    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 2
      targetCPUUtilizationPercentage: 80
      # targetMemoryUtilizationPercentage: 80

    nodeSelector: {}

    tolerations: []

    affinity: {}

    initContainers: {}

    volumeMounts: {}

    volumes: {}
